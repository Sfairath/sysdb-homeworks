services:
  elasticsearch:
    image: elasticsearch:9.3.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.name=logvinenko-vi          
      - node.name=elasticsearch             
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      # - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ports:
      - "9200:9200"
    networks:
      - elk
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"\\(green\\|yellow\\)\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  kibana:
    image: kibana:9.3.4
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - elk
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  logstash:
    image: logstash:9.3.4
    container_name: logstash
    ports:
      - "5000:5000"
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      # - ./raw_logs.conf:/usr/share/logstash/pipeline/raw_logs.conf:ro
    networks:
      - elk
    depends_on:
      elasticsearch:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  filebeat:
    image: elastic/filebeat:9.4.0
    container_name: filebeat
    user: root
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro #конфиг
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - elk
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "8888:80"
    networks:
      - elk
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  elasticsearch_data:

networks:
  elk:
    driver: bridge