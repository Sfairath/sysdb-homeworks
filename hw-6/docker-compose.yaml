services:
  mysql-1:
    container_name: mysql-1
    image: mysql:oraclelinux9
    ports:
      - 3306:3306
    environment:
      - MYSQL_DATABASE="mydb"
      - MYSQL_USER="mysql_1"
      - MYSQL_PASSWORD=${mysql_1_password}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_1_data:/var/lib/mysql
      - /home/sfairath/mysql/conf/master.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - mysql

  mysql-2:
    container_name: mysql-2
    image: mysql:oraclelinux9
    ports:
      - 3307:3306
    environment:
      - MYSQL_DATABASE="mydb"
      - MYSQL_USER="mysql_2"
      - MYSQL_PASSWORD=${mysql_2_password}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_2_data:/var/lib/mysql
      - /home/sfairath/mysql/conf/slave.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - mysql

volumes:
  mysql_1_data:
  mysql_2_data:

networks:
  mysql: