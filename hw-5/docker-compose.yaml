services:
  mysql:
    container_name: mysql
    image: mysql:oraclelinux9
    ports:
      - 3306:3306
    environment:
      - MYSQL_DATABASE="mydb"
      - MYSQL_USER="sys_temp"
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
